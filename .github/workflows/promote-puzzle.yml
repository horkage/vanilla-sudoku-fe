name: Promote Puzzle to Production

on:
  workflow_dispatch:
    inputs:
      difficulty:
        description: 'Target difficulty level'
        required: true
        type: choice
        options:
          - easy
          - medium
          - hard

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          ref: candidate
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find next available puzzle ID
        id: next_id
        run: |
          DIFFICULTY="${{ inputs.difficulty }}"

          # Fetch main branch to check what puzzles exist there
          git fetch origin main

          # Find the highest numbered puzzle file in the target difficulty on main branch
          LAST_ID=$(git ls-tree -r --name-only origin/main puzzle-data/$DIFFICULTY/ | \
            grep '\.puzzle$' | \
            sed 's/.*\/\([0-9]*\)\.puzzle/\1/' | \
            sort -n | \
            tail -1 || echo "0000")

          # Increment to get next ID
          NEXT_NUM=$((10#$LAST_ID + 1))
          NEXT_ID=$(printf "%04d" $NEXT_NUM)

          echo "next_id=$NEXT_ID" >> $GITHUB_OUTPUT
          echo "📝 Last ID on main: $LAST_ID"
          echo "📝 Next available ID in $DIFFICULTY: $NEXT_ID"

      - name: Prepare puzzle files for promotion
        run: |
          CANDIDATE_ID="001"
          DIFFICULTY="${{ inputs.difficulty }}"
          NEXT_ID="${{ steps.next_id.outputs.next_id }}"

          # Ensure candidate files exist
          if [ ! -f "puzzle-data/candidate/${CANDIDATE_ID}.puzzle" ]; then
            echo "❌ Error: No candidate puzzle in slot 001"
            exit 1
          fi

          if [ ! -f "puzzle-data/candidate/${CANDIDATE_ID}.grid" ]; then
            echo "❌ Error: puzzle-data/candidate/${CANDIDATE_ID}.grid not found"
            exit 1
          fi

          # Copy files to temporary location (outside git tree)
          cp "puzzle-data/candidate/${CANDIDATE_ID}.puzzle" "/tmp/promo_${NEXT_ID}.puzzle"
          cp "puzzle-data/candidate/${CANDIDATE_ID}.grid" "/tmp/promo_${NEXT_ID}.grid"

          # Copy optional metadata if it exists
          if [ -f "puzzle-data/candidate/${CANDIDATE_ID}.metadata.json" ]; then
            cp "puzzle-data/candidate/${CANDIDATE_ID}.metadata.json" "/tmp/promo_${NEXT_ID}.metadata.json"
          fi

          # Copy optional youtube ID if it exists
          if [ -f "puzzle-data/candidate/${CANDIDATE_ID}.youtube" ]; then
            cp "puzzle-data/candidate/${CANDIDATE_ID}.youtube" "/tmp/promo_${NEXT_ID}.youtube"
          fi

          # Copy preview screenshot if it exists
          if [ -f "puzzle-data/candidate/${CANDIDATE_ID}.png" ]; then
            cp "puzzle-data/candidate/${CANDIDATE_ID}.png" "/tmp/promo_${NEXT_ID}.png"
            echo "📸 Preview screenshot found"
          else
            echo "⚠️  No preview screenshot found (will need to be generated manually)"
          fi

          echo "✅ Prepared candidate ${CANDIDATE_ID} for promotion to $DIFFICULTY/${NEXT_ID}"

      - name: Stage promoted files on main
        run: |
          DIFFICULTY="${{ inputs.difficulty }}"
          NEXT_ID="${{ steps.next_id.outputs.next_id }}"

          git fetch origin main
          git checkout main

          # Copy promoted files from temp location
          cp "/tmp/promo_${NEXT_ID}.puzzle" "puzzle-data/$DIFFICULTY/${NEXT_ID}.puzzle"
          cp "/tmp/promo_${NEXT_ID}.grid" "puzzle-data/$DIFFICULTY/${NEXT_ID}.grid"

          # Copy optional files if they exist
          [ -f "/tmp/promo_${NEXT_ID}.metadata.json" ] && \
            cp "/tmp/promo_${NEXT_ID}.metadata.json" "puzzle-data/$DIFFICULTY/${NEXT_ID}.metadata.json"
          [ -f "/tmp/promo_${NEXT_ID}.youtube" ] && \
            cp "/tmp/promo_${NEXT_ID}.youtube" "puzzle-data/$DIFFICULTY/${NEXT_ID}.youtube"

          # Copy bare-grid preview screenshot to public images dir (fallback OG image)
          if [ -f "/tmp/promo_${NEXT_ID}.png" ]; then
            mkdir -p "public/images/puzzles/$DIFFICULTY"
            cp "/tmp/promo_${NEXT_ID}.png" "public/images/puzzles/$DIFFICULTY/${NEXT_ID}.png"
            echo "📸 Preview screenshot copied to public/images/puzzles/$DIFFICULTY/${NEXT_ID}.png"
          fi

          echo "✅ Staged $DIFFICULTY/${NEXT_ID} on main"

      # Best-effort: generate the polished social card and wire its metadata. Marked
      # continue-on-error so a Playwright/browser hiccup can never block a promotion —
      # worst case the puzzle still promotes and falls back to its bare-grid preview.
      - name: Generate social card + metadata
        continue-on-error: true
        run: |
          DIFFICULTY="${{ inputs.difficulty }}"
          NEXT_ID="${{ steps.next_id.outputs.next_id }}"

          npm ci
          npx playwright install --with-deps chromium

          # Boot the app and screenshot the /social-card route into public/social/
          npm run dev > /tmp/devserver.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3000 -o /dev/null && break; sleep 1; done

          node scripts/generate-social-card.mjs --difficulty="$DIFFICULTY" --id="$NEXT_ID"
          kill $DEV_PID 2>/dev/null || true

          # Only wire metadata to the card after the card exists, so the OG image
          # never points at a missing file.
          node scripts/ensure-puzzle-metadata.mjs --difficulty="$DIFFICULTY" --id="$NEXT_ID"

      - name: Commit and push to main
        run: |
          DIFFICULTY="${{ inputs.difficulty }}"
          NEXT_ID="${{ steps.next_id.outputs.next_id }}"

          git add "puzzle-data/$DIFFICULTY/"
          [ -d "public/images/puzzles/$DIFFICULTY" ] && git add "public/images/puzzles/$DIFFICULTY/"
          [ -d "public/social/$DIFFICULTY" ] && git add "public/social/$DIFFICULTY/"

          git commit -m "Promote candidate puzzle to $DIFFICULTY as ${NEXT_ID}"
          git push origin main

          echo "🚀 Pushed to main - production deployment will be triggered"

      - name: Trigger production deployment
        run: |
          # Wait a moment for the push to register
          sleep 5

          # Trigger the production deployment workflow
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-prod.yml/dispatches \
            -d '{"ref":"main"}'

          echo "✅ Production deployment triggered"

      - name: Cleanup candidate on candidate branch
        run: |
          CANDIDATE_ID="001"

          # Switch back to candidate branch
          git checkout candidate

          # Remove promoted puzzle from slot 001
          rm -f "puzzle-data/candidate/${CANDIDATE_ID}.puzzle"
          rm -f "puzzle-data/candidate/${CANDIDATE_ID}.grid"
          rm -f "puzzle-data/candidate/${CANDIDATE_ID}.metadata.json"
          rm -f "puzzle-data/candidate/${CANDIDATE_ID}.youtube"
          rm -f "puzzle-data/candidate/${CANDIDATE_ID}.png"

          # Commit and push
          git add puzzle-data/candidate/
          git commit -m "Clear candidate slot after promoting to ${DIFFICULTY}" || echo "No changes to commit"
          git push origin candidate || echo "Nothing to push"

          echo "🧹 Cleared candidate slot 001"

      - name: Cleanup temporary files
        if: always()
        run: |
          NEXT_ID="${{ steps.next_id.outputs.next_id }}"
          rm -f "/tmp/promo_${NEXT_ID}.puzzle"
          rm -f "/tmp/promo_${NEXT_ID}.grid"
          rm -f "/tmp/promo_${NEXT_ID}.metadata.json"
          rm -f "/tmp/promo_${NEXT_ID}.youtube"
          rm -f "/tmp/promo_${NEXT_ID}.png"
          echo "🧹 Cleaned up temporary promotion files"
