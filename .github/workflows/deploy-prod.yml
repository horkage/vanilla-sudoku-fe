name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment archive
        run: |
          # Remove build artifacts if they exist
          rm -rf .next node_modules

          # Create archive (ignore warnings about files changing)
          tar --warning=no-file-changed -czf vanilla-sudoku.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            . || if [ $? -eq 1 ]; then exit 0; else exit $?; fi

      - name: Upload to server
        run: |
          scp -i ~/.ssh/deploy_key vanilla-sudoku.tar.gz ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/home/ubuntu/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'EOF'
            set -e

            # Source NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20 || export PATH="$HOME/.nvm/versions/node/v20.19.2/bin:$PATH"

            BUILD_DIR=vanilla-sudoku

            # Backup current version (mv is instant and needs no extra disk;
            # PM2 keeps serving from the moved directory until the
            # post-build restart picks up the new one)
            if [ -d "$BUILD_DIR" ]; then
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              mv $BUILD_DIR ${BUILD_DIR}_backup_$TIMESTAMP
              echo "🔄 Backup created: ${BUILD_DIR}_backup_$TIMESTAMP"
            fi

            # Extract new version
            mkdir $BUILD_DIR
            tar -xzf vanilla-sudoku.tar.gz -C $BUILD_DIR

            # Build
            cd $BUILD_DIR
            npm install

            if npm run build; then
              echo "✅ Build succeeded"
              pm2 restart sudoku
              echo "🔄 PM2 process restarted"
            else
              echo "❌ Build failed. Reverting..."
              cd ..
              rm -rf $BUILD_DIR
              LATEST_BACKUP=$(ls -td ${BUILD_DIR}_backup_* 2>/dev/null | head -1)
              if [ -n "$LATEST_BACKUP" ]; then
                mv $LATEST_BACKUP $BUILD_DIR
                echo "🔁 Rolled back to $LATEST_BACKUP"
                pm2 restart sudoku
              else
                echo "⚠️ No backup found to revert to!"
              fi
              exit 1
            fi

            # Cleanup old backups (keep only 2 most recent)
            cd /home/ubuntu
            ls -td ${BUILD_DIR}_backup_* 2>/dev/null | tail -n +3 | xargs -r rm -rf

            # Cleanup tarball
            rm -f /home/ubuntu/vanilla-sudoku.tar.gz
          EOF

      - name: Post to Bluesky
        if: success()
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          # Auto-post only when this deploy is a puzzle promotion.
          # Example commit: "Promote candidate puzzle 001 to easy as 0014"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if ! echo "$COMMIT_MSG" | grep -q "Promote candidate puzzle"; then
            echo "ℹ️ Not a puzzle promotion commit, skipping Bluesky post"
            exit 0
          fi

          DIFFICULTY=$(echo "$COMMIT_MSG" | sed -n 's/.*to \(easy\|medium\|hard\) as.*/\1/p')
          PUZZLE_ID=$(echo "$COMMIT_MSG" | sed -n 's/.*as \([0-9]*\).*/\1/p')
          if [ -z "$DIFFICULTY" ] || [ -z "$PUZZLE_ID" ]; then
            echo "⚠️ Could not parse difficulty/id from commit; skipping Bluesky post"
            exit 0
          fi

          # All Bluesky logic (auth, image blob upload, embed card, facets) lives in
          # the script so CI and local runs share one implementation.
          node scripts/post-to-bluesky.mjs --difficulty="$DIFFICULTY" --id="$PUZZLE_ID"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f vanilla-sudoku.tar.gz
